version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      development-dependencies:
        dependency-type: development
      production-patch-minor:
        dependency-type: production
        update-types:
          - patch
          - minor
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
